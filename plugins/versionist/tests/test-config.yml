# Test configuration used by WpAutomation, parsed into `TestConfig`.
#
# The sites below live inside the isolated test environment (`.wp-env.test.json`); tests run in its
# `wordpress` container, see `pnpm run test:e2e`. Database credentials are wp-env's defaults.

# Worker type to run the tests, 'selenium' or 'wp-cli'
end2end-test-type: wp-cli

# WP-CLI version used, e.g., '2.12.0' or 'latest-stable'
wp-cli-version: latest-stable

# Selenium configuration
selenium:

  # Where Selenium runs (port is expected to be 4444)
  host: selenium-hub

  # How long to wait after commit is made
  post-commit-wait-time: 500

# Default values for all sites, may be overridden by a specific site
common-site-config:
  db:
    table-prefix: wp_
  wp-site:
    admin-user: admin
    admin-email: admin@example.com
    admin-pass: adminpwd
    wp-version: latest
    wp-locale: en_US
    wp-autoupdate: false

# One of the sites below, used as the active one
test-site: wptest

# Test sites
sites:

  wptest:
    host: localhost
    installation-type: standard
    db:
      host: mysql
      dbname: vptests
      user: root
      password: password
    wp-site:
      # Path must always be a subfolder of /var/www/html for cloning & merging tests to work
      path: /var/www/html/wptest
      url: http://localhost/wptest
      wp-admin-path: wp-admin
      title: "Versionist Test"

  wptest-composer:
    host: localhost
    installation-type: composer
    db:
      host: mysql
      dbname: vptests
      user: root
      password: password
    wp-site:
      path: /var/www/html/wptest
      url: http://localhost/wptest/web # The site runs from subdirectory
      wp-admin-path: wp/wp-admin
      title: "Versionist Test (Composer)"
