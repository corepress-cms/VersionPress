name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from `git describe --tags`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start wp-env
        run: pnpm run start

      - name: Build
        run: pnpm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --prerelease
