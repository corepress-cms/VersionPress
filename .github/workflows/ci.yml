name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-static-analysis:
    name: PHP lint & static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/versionist
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPCS
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  php-tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start wp-env
        run: pnpm run start

      - name: Install Composer dependencies
        run: pnpm run composer install --no-interaction --no-progress

      - name: Run tests
        run: pnpm run test

  admin-ui:
    name: Admin UI & docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: pnpm run lint:js

      - name: Unit tests
        run: pnpm run test:js

      - name: Build
        run: pnpm run build:admin

      - name: Lint Markdown
        run: pnpm run lint:markdown

  release-build:
    name: Release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start wp-env
        run: pnpm run start

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: versionist-zip
          path: dist/*.zip
